<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="团队程序设计天梯赛 GPLT 225 道题的仓颉语言题解">
  <title>GPLT · 仓颉语言题解</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('gplt-theme');
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark-mode');
      } catch (error) {}
    }());
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #6a5acd;
      --accent: #6a5acd;
      --page-bg: #ffffff;
      --surface: #ffffff;
      --sidebar-bg: #f7f7fb;
      --text: #2c3e50;
      --muted: #6b7280;
      --border: #e7e7ef;
      --code-bg: #f6f7fc;
      --quote-bg: #f5f3ff;
    }

    html.dark-mode,
    body.dark-mode {
      --page-bg: #12131a;
      --surface: #1c1f2e;
      --sidebar-bg: #171a27;
      --text: #e6e8f2;
      --muted: #a9aec1;
      --border: #2a2f4a;
      --code-bg: #151824;
      --quote-bg: #24223b;
    }

    html.dark-mode body,
    body.dark-mode {
      background: var(--page-bg) !important;
      color: var(--text) !important;
    }

    html.dark-mode .app-nav,
    html.dark-mode .app-sub-sidebar,
    html.dark-mode .markdown-section,
    html.dark-mode .content,
    html.dark-mode .sidebar,
    body.dark-mode .app-nav,
    body.dark-mode .app-sub-sidebar,
    body.dark-mode .markdown-section,
    body.dark-mode .content,
    body.dark-mode .sidebar {
      background: var(--surface) !important;
      color: var(--text) !important;
    }

    html.dark-mode .sidebar,
    body.dark-mode .sidebar {
      background: var(--sidebar-bg) !important;
      border-right-color: var(--border) !important;
    }

    html.dark-mode .markdown-section h1,
    html.dark-mode .markdown-section h2,
    html.dark-mode .markdown-section h3,
    html.dark-mode .markdown-section h4,
    html.dark-mode .markdown-section strong,
    html.dark-mode .markdown-section p,
    html.dark-mode .markdown-section li,
    html.dark-mode .markdown-section td,
    html.dark-mode .markdown-section th,
    body.dark-mode .markdown-section h1,
    body.dark-mode .markdown-section h2,
    body.dark-mode .markdown-section h3,
    body.dark-mode .markdown-section h4,
    body.dark-mode .markdown-section strong,
    body.dark-mode .markdown-section p,
    body.dark-mode .markdown-section li,
    body.dark-mode .markdown-section td,
    body.dark-mode .markdown-section th {
      color: var(--text) !important;
    }

    html.dark-mode a,
    body.dark-mode a { color: #a99cff !important; }
    html.dark-mode .sidebar-nav > ul > li > a,
    body.dark-mode .sidebar-nav > ul > li > a { color: var(--text) !important; }
    html.dark-mode .sidebar-nav li > a,
    body.dark-mode .sidebar-nav li > a { color: var(--muted) !important; }
    html.dark-mode .sidebar-nav li.active > a,
    body.dark-mode .sidebar-nav li.active > a { color: #b7afff !important; border-right-color: var(--accent); }
    html.dark-mode blockquote,
    body.dark-mode blockquote { background: var(--quote-bg); border-left-color: #9185ff; color: var(--text); }
    html.dark-mode table,
    body.dark-mode table { border-color: var(--border); }
    html.dark-mode tr,
    body.dark-mode tr { border-bottom-color: var(--border); }
    html.dark-mode code,
    body.dark-mode code { background: #2a2944; color: #d6d1ff; }
    html.dark-mode pre,
    body.dark-mode pre { background: var(--code-bg) !important; border: 1px solid var(--border); }
    html.dark-mode .search .search input,
    body.dark-mode .search .search input { background: var(--surface); color: var(--text); border-color: var(--border); }
    html.dark-mode .pagination-item a,
    body.dark-mode .pagination-item a { color: #a99cff !important; }

    .sidebar {
      width: 340px;
      border-right: 1px solid var(--border);
      background: var(--sidebar-bg);
    }

    .content { left: 340px; }

    .sidebar-nav {
      padding: 20px 16px 80px;
    }

    /* The sidebar contains every problem title; long Chinese titles must remain visible. */
    .sidebar-nav li,
    .sidebar-nav a {
      white-space: normal;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: break-word;
      line-height: 1.5;
    }

    .sidebar-nav > ul > li > a {
      font-weight: 700;
      color: var(--text);
    }

    .sidebar-nav ul ul { padding-left: 14px; }
    .sidebar-nav li > p { margin: 0.55em 0 0.25em; color: var(--accent); font-weight: 700; }
    .markdown-section { max-width: 1100px; }
    .markdown-section code { border-radius: 5px; }
    .markdown-section pre { border-radius: 10px; box-shadow: 0 7px 24px rgba(106, 90, 205, 0.07); }

    .theme-toggle {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 9999;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(106, 90, 205, 0.28);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #5144b4;
      box-shadow: 0 8px 28px rgba(44, 37, 102, 0.2);
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-toggle:hover { transform: translateY(-3px) scale(1.04); }
    html.dark-mode .theme-toggle,
    body.dark-mode .theme-toggle {
      background: rgba(35, 38, 58, 0.94);
      color: #e6e1ff;
      border-color: rgba(169, 156, 255, 0.45);
    }

    @media (max-width: 768px) {
      .sidebar { width: 300px; }
      .content { left: 0; }
      .theme-toggle { right: 16px; bottom: 16px; }
    }
  </style>
</head>
<body>
  <div id="app">正在加载题解目录……</div>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换暗黑模式" title="切换暗黑模式">🌙</button>

  <script>
    window.$docsify = {
      name: 'GPLT · 仓颉语言题解',
      repo: 'https://github.com/Zonkidd-Shao/gplt_by_cjc',
      homepage: 'README.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      search: {
        placeholder: '🔍 搜索题号 / 标题 / 关键词',
        depth: 4,
        noData: '没有找到结果',
        paths: 'auto'
      },
      pagination: {
        previousText: '上一题',
        nextText: '下一题',
        crossChapter: true,
        crossChapterText: true
      },
      copyCode: { buttonText: '复制', successText: '已复制' },
      count: { countable: true, language: 'chinese' }
    };

    (function () {
      var button = document.getElementById('theme-toggle');

      function isDark() {
        return document.documentElement.classList.contains('dark-mode');
      }

      function applyTheme(dark, persist) {
        document.documentElement.classList.toggle('dark-mode', dark);
        document.body.classList.toggle('dark-mode', dark);
        button.textContent = dark ? '☀️' : '🌙';
        button.title = dark ? '切换亮色模式' : '切换暗黑模式';
        button.setAttribute('aria-label', button.title);
        if (persist) localStorage.setItem('gplt-theme', dark ? 'dark' : 'light');
      }

      applyTheme(isDark(), false);
      button.addEventListener('click', function () { applyTheme(!isDark(), true); });
      document.addEventListener('keydown', function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'd') {
          event.preventDefault();
          applyTheme(!isDark(), true);
        }
      });
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (event) {
        if (!localStorage.getItem('gplt-theme')) applyTheme(event.matches, false);
      });
    }());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countable@3/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script>
    if (window.Prism && Prism.languages.c) Prism.languages.cangjie = Prism.languages.c;
  </script>
</body>
</html>
